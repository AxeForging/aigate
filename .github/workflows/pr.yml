name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: AxeForging/reusable-workflows/actions/pr-title-lint@291855e85ec985d1d318df82b8f9dce969b76933
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: ${{ github.event.pull_request.title }}

  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisory AI review — never block a PR on it (e.g. expired AI_API_KEY).
      - uses: AxeForging/reviewforge@main
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_PROVIDER: gemini
          AI_MODEL: gemini-2.5-flash
          AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOW_TOKEN_USAGE: true
          INCREMENTAL: false
          REVIEW_RULES: concise

  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Build candidate and install external quality gates
        run: |
          QUALITY_BIN="$RUNNER_TEMP/quality-bin"; mkdir -p "$QUALITY_BIN"
          go build -o "$QUALITY_BIN/aigate" .
          curl -fsSL https://raw.githubusercontent.com/AxeForging/structlint/main/install.sh | STRUCTLINT_VERSION=v0.6.0 STRUCTLINT_INSTALL_DIR="$QUALITY_BIN" sh
          curl -fsSL https://raw.githubusercontent.com/AxeForging/dupehound/main/install.sh | DUPEHOUND_VERSION=v0.1.0 DUPEHOUND_INSTALL_DIR="$QUALITY_BIN" sh
          echo "$QUALITY_BIN" >> "$GITHUB_PATH"
      - uses: AxeForging/gauntlet@v0.1.0
        with:
          since: origin/${{ github.base_ref }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Install sandbox tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap slirp4netns acl
      - name: AppArmor userns check (Ubuntu 23.10+ restriction)
        run: |
          go build -o /tmp/aigate .
          /tmp/aigate doctor > /tmp/doctor.txt 2>&1 || true
          cat /tmp/doctor.txt
          if grep -q "AppArmor is blocking" /tmp/doctor.txt; then
            # The fix aigate prints must work.
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap $(command -v bwrap) flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
            /tmp/aigate doctor | grep -q "apparmor userns  bwrap can create its namespaces"
          elif [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            # Restricted, but this image already allows bwrap: doctor must say so.
            grep -q "apparmor userns  bwrap can create its namespaces" /tmp/doctor.txt
          fi
      - run: go test -race -count=1 ./...
