name: macOS

# Every PR and push to main (free on public repos), or by hand:
#   gh workflow run macos.yml --ref <branch>
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
      - name: Unit + integration tests (Seatbelt)
        run: go test -count=1 ./...
      - name: Doctor
        run: go build -o "$RUNNER_TEMP/aigate" . && "$RUNNER_TEMP/aigate" doctor
